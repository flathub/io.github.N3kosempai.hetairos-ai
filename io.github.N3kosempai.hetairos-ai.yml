app-id: io.github.N3kosempai.hetairos-ai
runtime: org.gnome.Platform
runtime-version: "51"
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node26
  - org.freedesktop.Sdk.Extension.llvm22
sdk: org.gnome.Sdk
command: hetairos-ai
finish-args:
  - --env=ORT_DYLIB_PATH=/app/lib/libonnxruntime.so
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --socket=pulseaudio
modules:
  - name: hetairos-ai
    buildsystem: simple
    build-commands:
      - install -Dm755 hetairos-ai /app/bin/hetairos-ai
      - mkdir -p /app/lib
      - cp -a lib/libonnxruntime.so* /app/lib/
      - install -Dm644 share/applications/io.github.N3kosempai.hetairos-ai.desktop /app/share/applications/io.github.N3kosempai.hetairos-ai.desktop
      - install -Dm644 share/metainfo/io.github.N3kosempai.hetairos-ai.metainfo.xml /app/share/metainfo/io.github.N3kosempai.hetairos-ai.metainfo.xml
      - install -Dm644 share/dbus-1/services/io.github.N3kosempai.hetairos-ai.service /app/share/dbus-1/services/io.github.N3kosempai.hetairos-ai.service
      - install -Dm644 share/icons/hicolor/512x512/apps/io.github.N3kosempai.hetairos-ai.png /app/share/icons/hicolor/512x512/apps/io.github.N3kosempai.hetairos-ai.png
    sources:
      - type: archive
        url: https://github.com/N3koSempai/hetairos-ai/releases/download/v5.8.0/hetairos-ai-5.8.0-x86_64.tar.gz
        sha256: 399d2c2065a20c6f6dbd00908e3cb35205cc56e77963ec1f9f76b1161e05c624
        only-arches:
          - x86_64
